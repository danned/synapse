name: Web build and Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.2
      GODOT_LINUX_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
      GODOT_TEMPLATES_SHA256: f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and Web export templates
        shell: bash
        run: |
          set -euo pipefail
          release="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          binary_archive="${RUNNER_TEMP}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          templates_archive="${RUNNER_TEMP}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          curl --fail --location --retry 3 "${release}/$(basename "${binary_archive}")" --output "${binary_archive}"
          echo "${GODOT_LINUX_SHA256}  ${binary_archive}" | sha256sum --check --strict
          unzip -q "${binary_archive}" -d "${RUNNER_TEMP}/godot"
          sudo install -m 0755 "${RUNNER_TEMP}/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl --fail --location --retry 3 "${release}/$(basename "${templates_archive}")" --output "${templates_archive}"
          echo "${GODOT_TEMPLATES_SHA256}  ${templates_archive}" | sha256sum --check --strict
          templates_dir="${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "${templates_dir}"
          unzip -q "${templates_archive}" 'templates/version.txt' 'templates/web*.zip' -d "${RUNNER_TEMP}/godot-templates"
          mv "${RUNNER_TEMP}/godot-templates/templates/"* "${templates_dir}/"
      - name: Import project
        run: godot --headless --editor --path . --quit
      - name: Run tests
        run: godot --headless --path . --script res://tests/run_tests.gd
      - name: Export Web build
        run: |
          mkdir -p dist/web
          godot --headless --path . --export-release Web dist/web/index.html
          test -s dist/web/index.html
          test -s dist/web/index.pck
          test -s dist/web/index.wasm
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
